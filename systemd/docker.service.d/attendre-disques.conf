# ==========================================================================
#  Complément ("drop-in") au service Docker : attendre les disques externes
#  Fichier fusionné par systemd avec docker.service d'origine (qui, lui,
#  serait écrasé par les mises à jour du paquet : on n'y touche pas).
# ==========================================================================
[Unit]
# After = ORDRE : Docker démarre après la tentative de montage des disques.
After=mnt-medias.mount mnt-telechargements.mount
# Wants (et non Requires) = si un disque est vraiment absent, Docker démarre
# QUAND MÊME (Caddy, DuckDNS, Gluetun tournent) ; seuls les conteneurs qui
# ont besoin de ce disque refusent de démarrer (create_host_path: false).
Wants=mnt-medias.mount mnt-telechargements.mount
