# ==========================================================================
#  Filtre fail2ban : échecs de connexion Jellyfin / Navidrome
#  Source : journal JSON de Caddy (/srv/appdata/caddy/logs/access.log)
#  Une ligne = une requête. Echec = code HTTP 401 sur une page de login :
#    Jellyfin  : POST /Users/AuthenticateByName
#    Navidrome : POST /auth/login
# ==========================================================================
[Definition]
# <HOST> = l'IP que fail2ban doit bannir (ici client_ip, la vraie IP).
failregex = ^.*"client_ip":"<HOST>".*"uri":"(?:/Users/AuthenticateByName|/auth/login)[^"]*".*"status":401

ignoreregex =

# Date de chaque ligne : champ "ts" en secondes depuis 1970 (format EPOCH)
datepattern = "ts":{EPOCH}
